[project]
name = "findex"
version = "0.1.0"
description = "findex — a small full-text search engine built step by step (university course)"
readme = "README.md"
authors = [{ name = "Student" }]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
